# Optional proxy deployment for a NEW instance. See docs/avbase.md before use.
services:
  mitmproxy:
    image: mitmproxy/mitmproxy:12.2.3
    command: mitmdump --listen-host 0.0.0.0 --listen-port 8080
    volumes:
      - ./mitmproxy:/home/mitmproxy/.mitmproxy
    restart: unless-stopped
    # No published proxy port; only containers on this network can use it.

  metatube:
    image: ghcr.io/charmingcheung/metatube-server:dev
    depends_on:
      - mitmproxy
    ports:
      - "127.0.0.1:1026:8080"
    environment:
      MT_MOVIE_PROVIDER_AVBASE__PRIORITY: "1010"
      MT_MOVIE_PROVIDER_AVBASE__PROXY: http://mitmproxy:8080
      MT_MOVIE_PROVIDER_AVBASE__REQUEST_INTERVAL: 5s
      MT_MOVIE_PROVIDER_AVBASE__BLOCKED_COOLDOWN: 10m
      MT_MOVIE_PROVIDER_AVBASE__MAX_RETRIES: "2"
      MT_MOVIE_PROVIDER_AVBASE__TIMEOUT: 90s
      SSL_CERT_FILE: /etc/ssl/certs/avbase-mitmproxy.pem
    volumes:
      - ./metatube:/config
      - type: bind
        source: ./mitmproxy/mitmproxy-ca-cert.pem
        target: /etc/ssl/certs/avbase-mitmproxy.pem
        read_only: true
        bind:
          create_host_path: false
    command: -dsn /config/metatube.db -port 8080 -db-auto-migrate
    restart: unless-stopped
